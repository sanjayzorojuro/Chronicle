<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unlock and read your sealed time capsule on Chronicle. Reveal messages from the past when the unlock date arrives."
    />
    <title>Unlock Capsule — Chronicle</title>
    <link rel="stylesheet" href="../assets/css/common.css" />
    <link rel="stylesheet" href="../assets/css/unlock.css" />
    <script src="../assets/js/common.js"></script>
  </head>
  <body>
    <!-- Skip to content (Accessibility) -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header class="site-header">
      <a href="vault.html" class="site-logo">Chronicle<span>.</span></a>
      <button type="button" class="nav-toggle" id="nav-toggle-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="primary-nav">☰</button>
      <nav class="site-nav" id="primary-nav" aria-label="Main navigation">
        <a href="vault.html">My Vault</a>
        <a href="seal.html">Seal Capsule</a>
        <a href="journey.html">Journey</a>
        <a href="unlock.html" class="active" aria-current="page">Unlock</a>
        <a href="login.html" class="nav-signout">Sign Out</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Live region for screen readers to announce status changes -->
      <div id="live-region" aria-live="polite" class="sr-only" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;"></div>

      <!-- Lock Status -->
      <section class="unlock-status" aria-label="Capsule unlock status">
        <div id="lock-icon" class="lock-icon" aria-hidden="true">🔒</div>
        <p id="status-text" class="status-text">Sealed</p>
        <div id="spinner" class="spinner" aria-hidden="true"></div>
      </section>

      <!-- Capsule Content (hidden until unlocked) -->
      <article id="capsule-content" class="capsule-content card" aria-label="Capsule contents">
        <h1 id="cap-title" class="capsule-title"></h1>

        <div class="capsule-meta">
          <div class="capsule-meta-item">
            <strong>Created by</strong>
            <span id="cap-creator"></span>
          </div>
          <div class="capsule-meta-item">
            <strong>Category</strong>
            <span id="cap-category"></span>
          </div>
          <div class="capsule-meta-item">
            <strong>Created</strong>
            <span id="cap-date-created"></span>
          </div>
          <div class="capsule-meta-item">
            <strong>Opened</strong>
            <span id="cap-date-opened"></span>
          </div>
        </div>

        <hr class="capsule-divider" />

        <!-- Message -->
        <div id="cap-message" class="capsule-message"></div>

        <!-- Attachment (optional) -->
        <div id="cap-attachment" class="capsule-attachment" style="display: none;">
          <strong>Attachment</strong>
          <a id="cap-link" href="#" target="_blank" rel="noopener noreferrer">View Attachment</a>
        </div>

        <hr class="capsule-divider" />

        <!-- Actions -->
        <div class="capsule-actions">
          <a href="journey.html" class="btn btn-primary">Continue Journey →</a>
          <a href="vault.html" class="btn btn-outline">← Back to Vault</a>
        </div>
      </article>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>&copy; 2026 Chronicle. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="../assets/js/unlock.js"></script>
  </body>
</html>
