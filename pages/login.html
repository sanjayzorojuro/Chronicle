<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Sign in to your Chronicle account to unlock personal time capsules, view scheduled memories, and manage time chains." />
  <title>Sign In — Chronicle</title>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <script src="../assets/js/common.js"></script>
  <script>
    if (localStorage.getItem("chronicle_active_user")) {
      window.location.replace("discover.html");
    }
  </script>
</head>

<body>
  <!-- Skip to content (Accessibility) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="site-header">
    <a href="login.html" class="site-logo">Chronicle<span>.</span></a>
    <button type="button" class="nav-toggle" id="nav-toggle-btn" aria-label="Toggle navigation menu"
      aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav class="site-nav" id="primary-nav" aria-label="Main navigation">
      <a href="login.html" class="active" aria-current="page">Sign In</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="auth-main">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="auth-icon" aria-hidden="true">🔒</div>
        <h1>Welcome Back</h1>
        <p>Sign in to open your encrypted vault and scheduled memories</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group" id="group-username">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" placeholder="Akshaybhat@gamil.com" required
            autocomplete="username" aria-describedby="username-error" />
          <span class="error-msg" id="username-error" role="alert">Please enter your username or email.</span>
        </div>

        <div class="form-group" id="group-password">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link" id="link-forgot">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required
              autocomplete="current-password" aria-describedby="password-error" />
            <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Show password"
              title="Show password">
              👁
            </button>
          </div>
          <span class="error-msg" id="password-error" role="alert">Please enter your password.</span>
        </div>

        <div class="auth-options">
          <label class="remember-label">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember me on this device</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-auth-submit" id="btn-login">
          Sign In to Vault →
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account yet? <a href="register.html">Create an Account</a></p>
      </div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 Chronicle. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>

</html>
